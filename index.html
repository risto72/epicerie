<style id="style-coffre">
  :root { --fond: #f3f6fb; --surface: #ffffff; --encre: #14203a; --douce: #526079; --trait: #d3dcea; --accent: #1a64cc; --accent-texte: #ffffff; --alerte: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #0d1220; --surface: #161d2e; --encre: #e8eefa; --douce: #a0aec6; --trait: #2b3550; --accent: #6aa6ff; --accent-texte: #04163a; --alerte: #ff8a7a; color-scheme: dark; }
  }
  .coffre-page { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(160deg, #1f6fd6, #0a3f94); color: var(--encre);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
  .coffre { width: 100%; max-width: 360px; display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--trait); border-radius: 16px; box-shadow: 0 16px 40px rgba(2, 26, 69, .35); padding: 24px 20px; box-sizing: border-box; }
  .coffre img { width: 64px; height: 64px; border-radius: 14px; }
  .coffre h1 { margin: 0; font-size: 22px; }
  .coffre p { margin: 0; color: var(--douce); font-size: 15px; }
  .coffre input { font: inherit; color: inherit; width: 100%; box-sizing: border-box; border: 1px solid var(--trait); border-radius: 10px; background: var(--fond); padding: 12px; font-size: 17px; }
  .coffre button { font: inherit; font-weight: 600; min-height: 48px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-texte); cursor: pointer; }
  .coffre button[disabled] { opacity: .6; }
  .champ-phrase { position: relative; }
  .champ-phrase input { padding-right: 96px; }
  .coffre .voir { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); min-height: 36px; padding: 0 12px;
    background: transparent; color: var(--accent); border: 1px solid var(--trait); font-size: 14px; }
  .coffre .erreur { color: var(--alerte); font-size: 14px; min-height: 1.4em; }
  .coffre :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>

<form class="coffre" id="form-coffre" autocomplete="on" hidden>
  <img src="icone-180.png" alt="">
  <h1>Épicerie futée</h1>
  <p>Cette application est privée. Entre la phrase de passe pour l’ouvrir. Cet appareil s’en souviendra.</p>
  <input type="text" name="username" value="Épicerie futée" autocomplete="username" hidden>
  <div class="champ-phrase">
    <input type="password" id="phrase" name="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Phrase de passe" placeholder="Phrase de passe" required>
    <button type="button" class="voir" id="btn-voir" aria-pressed="false" aria-controls="phrase">Afficher</button>
  </div>
  <button type="submit" id="btn-ouvrir">Déverrouiller</button>
  <div class="erreur" id="erreur-coffre" role="alert"></div>
</form>
